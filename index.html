<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Дентіс — швидкі дії для пацієнтів стоматологічної клініки.">
<title>Дентіс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --ceramic: #f3f0e8;
  --porcelain: #fffdf7;
  --mist: #e8ece5;
  --sage: #8f9f91;
  --sage-deep: #596960;
  --copper: #b8734d;
  --copper-deep: #7b432d;
  --graphite: #20241f;
  --muted: rgba(32, 36, 31, 0.62);
  --line: rgba(32, 36, 31, 0.14);
  --glass: rgba(255, 253, 247, 0.68);
  --focus: rgba(184, 115, 77, 0.86);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  min-height: 100%;
  background: var(--ceramic);
}

body {
  min-width: 320px;
  min-height: 100%;
  margin: 0;
  color: var(--graphite);
  background: var(--ceramic);
  font-family: "Onest", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow-x: hidden;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

.qr-page {
  position: relative;
  isolation: isolate;
  min-height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.94), transparent 18rem),
    radial-gradient(circle at 86% 8%, rgba(143, 159, 145, 0.34), transparent 19rem),
    radial-gradient(circle at 78% 78%, rgba(184, 115, 77, 0.2), transparent 16rem),
    linear-gradient(145deg, #fffdf7 0%, #f1eee6 48%, #dfe7df 100%);
}

.qr-page::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    linear-gradient(115deg, transparent 0 41%, rgba(32, 36, 31, 0.07) 41.1% 41.35%, transparent 41.45% 100%),
    linear-gradient(90deg, rgba(255, 255, 255, 0.44), transparent 34%, rgba(255, 255, 255, 0.22));
}

.qr-page::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 22% 24%, rgba(32, 36, 31, 0.08) 0 1px, transparent 1.35px),
    radial-gradient(circle at 78% 70%, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.35px);
  background-size: 18px 18px, 22px 22px;
  opacity: 0.38;
  mix-blend-mode: multiply;
}

.screen {
  width: min(100%, 440px);
  min-height: 100dvh;
  margin: 0 auto;
  padding:
    calc(env(safe-area-inset-top) + 24px)
    max(18px, env(safe-area-inset-right))
    calc(env(safe-area-inset-bottom) + 22px)
    max(18px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
}

.brand {
  position: relative;
  width: min(100%, 390px);
  padding-top: clamp(2px, 2.2dvh, 20px);
  text-align: left;
  animation: rise 680ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

.brand-rule {
  width: 54px;
  height: 3px;
  margin: 0 0 13px;
  background: linear-gradient(90deg, var(--copper), rgba(184, 115, 77, 0.16));
  border-radius: 999px;
}

.brand-name {
  margin: 0;
  color: var(--graphite);
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(4rem, 18vw, 5.8rem);
  font-weight: 700;
  line-height: 0.78;
  letter-spacing: 0;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.78);
}

.brand-subtitle {
  width: min(100%, 310px);
  margin: 14px 0 0 3px;
  color: var(--muted);
  font-size: clamp(0.72rem, 2.65vw, 0.82rem);
  font-weight: 800;
  letter-spacing: 0.3em;
  line-height: 1.5;
  text-transform: uppercase;
}

.mark-stage {
  position: relative;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  align-self: flex-end;
  width: min(76vw, 294px);
  min-height: clamp(168px, 30dvh, 244px);
  margin: clamp(10px, 2.1dvh, 22px) -8px clamp(14px, 2.2dvh, 22px) 0;
  border: 1px solid rgba(255, 255, 255, 0.66);
  border-radius: 8px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(255, 253, 247, 0.34)),
    radial-gradient(circle at 38% 28%, rgba(255, 255, 255, 0.98), transparent 9rem);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.8),
    inset 0 -1px 0 rgba(32, 36, 31, 0.06),
    0 32px 70px rgba(68, 78, 70, 0.18);
  backdrop-filter: blur(20px) saturate(1.08);
  animation: rise 760ms cubic-bezier(0.16, 1, 0.3, 1) 90ms both;
}

.mark-stage::before {
  content: "";
  position: absolute;
  inset: 11px;
  border: 1px solid rgba(32, 36, 31, 0.08);
  border-radius: 6px;
  background:
    linear-gradient(135deg, rgba(143, 159, 145, 0.18), transparent 45%),
    linear-gradient(315deg, rgba(184, 115, 77, 0.16), transparent 44%);
}

.mark-stage::after {
  content: "";
  position: absolute;
  width: 84px;
  height: 84px;
  right: -20px;
  bottom: -18px;
  border: 1px solid rgba(184, 115, 77, 0.2);
  border-radius: 50%;
  background: rgba(255, 253, 247, 0.45);
  box-shadow: inset 0 0 0 14px rgba(143, 159, 145, 0.1);
}

.brand-mark {
  position: relative;
  z-index: 1;
  width: clamp(158px, 48vw, 214px);
  height: clamp(112px, 18dvh, 152px);
  max-width: 74%;
  object-fit: contain;
  filter: saturate(0.9) contrast(1.04) drop-shadow(0 18px 24px rgba(32, 36, 31, 0.14));
}

.actions {
  display: grid;
  gap: clamp(9px, 1.55dvh, 12px);
  margin-top: clamp(8px, 1.8dvh, 16px);
  animation: rise 820ms cubic-bezier(0.16, 1, 0.3, 1) 170ms both;
}

.action {
  width: 100%;
  min-height: clamp(62px, 8dvh, 74px);
  display: grid;
  grid-template-columns: clamp(42px, 13vw, 52px) 1fr 20px;
  gap: clamp(10px, 3vw, 14px);
  align-items: center;
  padding: 9px clamp(12px, 3.8vw, 18px);
  border: 1px solid rgba(255, 255, 255, 0.64);
  border-radius: 8px;
  color: var(--graphite);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(255, 253, 247, 0.46)),
    rgba(255, 253, 247, 0.56);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.86),
    0 16px 42px rgba(68, 78, 70, 0.12);
  font: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  appearance: none;
  backdrop-filter: blur(18px) saturate(1.05);
  transition: border-color 220ms ease, box-shadow 220ms ease, transform 180ms ease, background 220ms ease, color 220ms ease;
}

.action:hover {
  border-color: rgba(184, 115, 77, 0.34);
  color: var(--copper-deep);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 253, 247, 0.58)),
    rgba(255, 253, 247, 0.72);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.92),
    0 18px 46px rgba(107, 84, 67, 0.16);
  transform: translateY(-2px);
}

.action:active {
  transform: scale(0.985) translateY(1px);
}

.action:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

.action-icon {
  width: clamp(42px, 13vw, 52px);
  height: clamp(42px, 13vw, 52px);
  display: grid;
  place-items: center;
  border: 1px solid rgba(32, 36, 31, 0.1);
  border-radius: 8px;
  color: var(--copper-deep);
  background:
    radial-gradient(circle at 50% 14%, rgba(255, 255, 255, 0.9), transparent 46%),
    rgba(143, 159, 145, 0.16);
  transition: background 220ms ease, color 220ms ease, transform 220ms ease;
}

.action:hover .action-icon {
  color: var(--graphite);
  background:
    radial-gradient(circle at 50% 14%, rgba(255, 255, 255, 0.95), transparent 46%),
    rgba(184, 115, 77, 0.14);
  transform: translateX(2px);
}

.action-icon svg {
  width: 24px;
  height: 24px;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.action-label {
  min-width: 0;
  color: currentColor;
  font-family: "Onest", system-ui, sans-serif;
  font-size: clamp(1rem, 4.15vw, 1.18rem);
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: 0;
  text-wrap: balance;
}

.action-arrow {
  width: 10px;
  height: 10px;
  border-top: 2px solid currentColor;
  border-right: 2px solid currentColor;
  transform: rotate(45deg);
  opacity: 0.58;
  transition: opacity 220ms ease, transform 220ms ease;
}

.action:hover .action-arrow {
  opacity: 1;
  transform: translateX(2px) rotate(45deg);
}

.footer {
  margin: clamp(12px, 2dvh, 22px) 0 0;
  color: rgba(32, 36, 31, 0.58);
  font-size: clamp(0.62rem, 2.35vw, 0.72rem);
  font-weight: 800;
  letter-spacing: 0.22em;
  line-height: 1.5;
  text-align: left;
  text-transform: uppercase;
  animation: rise 860ms cubic-bezier(0.16, 1, 0.3, 1) 240ms both;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-height: 700px) {
  .screen {
    padding-top: calc(env(safe-area-inset-top) + 16px);
    padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
  }

  .brand-rule {
    margin-bottom: 9px;
  }

  .brand-name {
    font-size: clamp(3.4rem, 16vw, 4.5rem);
  }

  .brand-subtitle {
    margin-top: 9px;
    font-size: 0.66rem;
    letter-spacing: 0.24em;
  }

  .mark-stage {
    width: min(70vw, 246px);
    min-height: 116px;
    margin-top: 7px;
    margin-bottom: 9px;
  }

  .brand-mark {
    width: clamp(116px, 38vw, 156px);
    height: clamp(82px, 16dvh, 112px);
  }

  .actions {
    gap: 8px;
  }

  .action {
    min-height: 54px;
    grid-template-columns: 40px 1fr 16px;
    padding: 8px 12px;
  }

  .action-icon {
    width: 40px;
    height: 40px;
  }

  .action-icon svg {
    width: 22px;
    height: 22px;
  }

  .action-label {
    font-size: clamp(0.94rem, 4.2vw, 1.08rem);
  }

  .footer {
    margin-top: 10px;
    font-size: 0.58rem;
    letter-spacing: 0.18em;
  }
}

@media (min-width: 700px) {
  .screen {
    width: 430px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 1ms !important;
  }
}
</style>
</head>
<body>
<main class="qr-page" aria-labelledby="brand-title">
  <div class="screen">
    <header class="brand">
      <div class="brand-rule" aria-hidden="true"></div>
      <h1 class="brand-name" id="brand-title">Дентіс</h1>
      <p class="brand-subtitle">Стоматологічна клініка</p>
    </header>

    <div class="mark-stage">
      <img class="brand-mark" src="image/dentis-logo.webp" alt="Дентіс лого">
    </div>

    <nav class="actions" aria-label="Швидкі дії">
      <a href="data:text/vcard;charset=utf-8,BEGIN:VCARD%0AVERSION:3.0%0AFN:Верховський Олександр Олександрович%0ATEL;TYPE=CELL:+380991234567%0AEND:VCARD"
         download="contact.vcf" class="action">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 10.5a4 4 0 1 1 8 0"/>
            <path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>
            <path d="M6.5 10.5h11"/>
            <path d="M12 2.5v4"/>
          </svg>
        </span>
        <span class="action-label">Додати в контакти</span>
        <span class="action-arrow" aria-hidden="true"></span>
      </a>



      <a href="https://dentis.kr.ua" class="action">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M3.5 12h17"/>
            <path d="M12 3.5c2.4 2.55 2.4 14.45 0 17"/>
            <path d="M12 3.5c-2.4 2.55-2.4 14.45 0 17"/>
          </svg>
        </span>
        <span class="action-label">Перейти на сайт</span>
        <span class="action-arrow" aria-hidden="true"></span>
      </a>

      <button class="action" type="button" onclick="addToCalendar()">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="5" width="16" height="16" rx="2"/>
            <path d="M4 9h16"/>
            <path d="M8 3v4"/>
            <path d="M16 3v4"/>
            <path d="M8 13h2"/>
            <path d="M12 13h2"/>
            <path d="M16 13h1"/>
            <path d="M8 17h2"/>
            <path d="M12 17h2"/>
          </svg>
        </span>
        <span class="action-label">Додати в календар</span>
        <span class="action-arrow" aria-hidden="true"></span>
      </button>

            <a href="https://t.me/dentis_notif_bot?start" class="action">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="13" r="7"/>
            <path d="M12 9v4l3 2"/>
            <path d="M8 3h8"/>
          </svg>
        </span>
        <span class="action-label">Нагадування про візит</span>
        <span class="action-arrow" aria-hidden="true"></span>
      </a>
    </nav>

    <footer class="footer">Сучасна стоматологія · Кропивницький</footer>
  </div>
</main>

<script>
function addToCalendar() {
  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Dentis//UA//EN",
    "BEGIN:VEVENT",
    "SUMMARY:Візит до Верховського О.О.",
    "DTSTART:20260201T120000",
    "DTEND:20260201T130000",
    "DESCRIPTION:Стоматологічна клініка Дентіс",
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");

  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "dentis-visit.ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1200);
}
</script>
</body>
</html>
