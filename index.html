<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Dentis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --primary: 180 50% 15%;
  --primary-foreground: 40 30% 97%;
  --accent: #2dd4bf;
  --accent-foreground: 0 0% 100%;
  --gold: 38 62% 52%;
  --gold-light: 38 70% 68%;
  --gold-dark: 38 55% 38%;
  --navy: 180 60% 25%;
  --bg: #020617;
  --card: #0f172a;
  --text: #e5e7eb;
  --muted: 40 20% 93%;
  --btn: #1e293b;
  --btn-hover: #334155;
  --gradient-hero: linear-gradient(135deg, hsl(180 60% 20%) 0%, hsl(180 55% 28%) 60%, hsl(180 50% 35%) 100%);
  --gradient-section: linear-gradient(180deg, hsl(183, 61%, 15%) 0%, hsl(171, 70%, 30%) 100%);
  --gradient-gold: linear-gradient(135deg, hsl(38, 80%, 65%) 0%, hsl(38, 75%, 72%) 60%, hsl(38, 70%, 76%) 100%);
  --gradient-golden: linear-gradient(135deg, hsl(38, 80%, 65%) 0%, hsl(38, 75%, 72%) 60%, hsl(38, 70%, 76%) 100%);
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(to right, #133939 17%, #196666 49%);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  width: 360px;
   background: linear-gradient(to bottom left, #133939 0%, #196666 78%);
  border-radius: 26px;
  padding: 28px;
  text-align: center;
  box-shadow: 0 40px 80px rgba(0,0,0,.7);
  position: relative;
  overflow: hidden;
}


.logo {
  width: 250px;
  margin-bottom: 3px;
}



h1 {
  font-size: 20px;
  line-height: 1.25;
  margin: 8px 0 4px;
}

.subtitle {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 22px;
}

.btn {
  display: block;
  padding: 15px;
  margin: 12px 0;
  border-radius: 16px;
  background: radial-gradient( circle 1047px at 24.8% 71.8%, rgba(204,153,0,1) 35.5%, rgba(253,216,53,1) 100.1% );
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  transition: .25s ease;
  box-shadow: 0 10px 20px rgba(0,0,0,.7);
}

.btn:hover {
  background: var(--btn-hover);
  transform: translateY(-1px);
}

.primary {
  background: linear-gradient(135deg, #ae8327, #ddaf27);
  
  
}

.primary:hover {
  background: linear-gradient(135deg, #977d38, #e6c148);
  
}

.footer {
  margin-top: 18px;
  font-size: 12px;
  color: var(--muted);
}

@keyframes pulseLogo {
  0% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.055;
  }
  50% {
    transform: translate(-50%, -50%) scale(1.06);
    opacity: 0.1;
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.055;
  }
}

.bg-logo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100%;
  max-width: 480px;
  pointer-events: none;
  animation: pulseLogo 3s ease-in-out infinite;
  filter: blur(0.5px);
}


</style>
</head>

<div class="card">

src="image/Dentis.webp">

  <img class="logo" src="image/Dentis_with_Text.webp" />

</html>
