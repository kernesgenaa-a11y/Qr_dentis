<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Дентіс — швидкі дії для пацієнтів стоматологічної клініки.">
<title>Дентіс</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #06110f;
  --surface: rgba(4, 16, 14, 0.78);
  --surface-strong: rgba(9, 25, 21, 0.92);
  --gold: #f1d98f;
  --gold-mid: #c79a44;
  --gold-deep: #7f5a25;
  --text: #fff8e8;
  --muted: rgba(255, 248, 232, 0.68);
  --line: rgba(241, 217, 143, 0.34);
  --focus: rgba(255, 232, 159, 0.9);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  min-height: 100%;
  background: var(--bg);
}

body {
  min-width: 320px;
  min-height: 100%;
  margin: 0;
  color: var(--text);
  background: var(--bg);
  font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow-x: hidden;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

.qr-page {
  position: relative;
  isolation: isolate;
  min-height: 100dvh;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(3, 9, 8, 0.22), rgba(3, 9, 8, 0.74)),
    #06110f;
}

.qr-page::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -3;
  background-image: url("image/dentis-bg-v2.png");
  background-position: center;
  background-size: cover;
  transform: scale(1.02);
}

.qr-page::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 28%, rgba(241, 217, 143, 0.16), transparent 23rem),
    linear-gradient(90deg, rgba(0, 0, 0, 0.42), transparent 20%, transparent 80%, rgba(0, 0, 0, 0.44)),
    linear-gradient(180deg, rgba(0, 0, 0, 0.18), transparent 34%, rgba(0, 0, 0, 0.56));
}

.screen {
  width: min(100%, 440px);
  min-height: 100dvh;
  margin: 0 auto;
  padding:
    calc(env(safe-area-inset-top) + 22px)
    max(18px, env(safe-area-inset-right))
    calc(env(safe-area-inset-bottom) + 22px)
    max(18px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
}

.brand {
  text-align: center;
  padding-top: clamp(2px, 2.4dvh, 22px);
  animation: rise 680ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

.brand-rule {
  width: min(54vw, 230px);
  height: 1px;
  margin: 0 auto 12px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.74;
}

.brand-name {
  margin: 0;
  color: var(--gold);
  font-family: "Forum", Georgia, serif;
  font-size: clamp(3.75rem, 17vw, 5.2rem);
  font-weight: 400;
  line-height: 0.82;
  letter-spacing: 0;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.24), 0 18px 42px rgba(0, 0, 0, 0.5);
}

.brand-subtitle {
  margin: 15px 0 0;
  color: var(--muted);
  font-size: clamp(0.76rem, 3vw, 0.9rem);
  font-weight: 700;
  letter-spacing: 0.42em;
  line-height: 1.4;
  text-transform: uppercase;
}

.mark-stage {
  position: relative;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  min-height: clamp(148px, 28dvh, 236px);
  margin: clamp(12px, 2.4dvh, 24px) 0 clamp(10px, 2dvh, 20px);
  animation: rise 760ms cubic-bezier(0.16, 1, 0.3, 1) 90ms both;
}

.mark-stage::before {
  content: "";
  position: absolute;
  width: min(72vw, 290px);
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(241, 217, 143, 0.2), transparent 58%),
    radial-gradient(circle, rgba(7, 39, 34, 0.72), transparent 68%);
  filter: blur(6px);
}

.brand-mark {
  position: relative;
  width: clamp(160px, 52vw, 232px);
  max-width: 78%;
  height: auto;
  filter:
    drop-shadow(0 24px 36px rgba(0, 0, 0, 0.5))
    drop-shadow(0 0 18px rgba(241, 217, 143, 0.2));
}

.actions {
  display: grid;
  gap: clamp(10px, 1.7dvh, 14px);
  margin-top: auto;
  animation: rise 820ms cubic-bezier(0.16, 1, 0.3, 1) 170ms both;
}

.action {
  width: 100%;
  min-height: clamp(66px, 8.5dvh, 78px);
  display: grid;
  grid-template-columns: clamp(44px, 14vw, 56px) 1fr 18px;
  gap: clamp(10px, 3vw, 16px);
  align-items: center;
  padding: 10px clamp(14px, 4vw, 20px);
  border: 1px solid var(--line);
  border-radius: 24px;
  color: var(--text);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 48%),
    linear-gradient(145deg, var(--surface-strong), var(--surface));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    inset 0 -1px 0 rgba(241, 217, 143, 0.12),
    0 16px 32px rgba(0, 0, 0, 0.34);
  font: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  appearance: none;
  transition: border-color 220ms ease, box-shadow 220ms ease, transform 180ms ease, background 220ms ease;
}

.action:hover {
  border-color: rgba(241, 217, 143, 0.64);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 48%),
    linear-gradient(145deg, rgba(13, 34, 29, 0.96), rgba(3, 17, 14, 0.86));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    inset 0 -1px 0 rgba(241, 217, 143, 0.18),
    0 18px 38px rgba(0, 0, 0, 0.38);
}

.action:active {
  transform: scale(0.985) translateY(1px);
}

.action:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

.action-icon {
  width: clamp(44px, 14vw, 56px);
  height: clamp(44px, 14vw, 56px);
  display: grid;
  place-items: center;
  border: 1px solid rgba(241, 217, 143, 0.4);
  border-radius: 16px;
  color: var(--gold);
  background:
    radial-gradient(circle at 50% 14%, rgba(241, 217, 143, 0.2), transparent 46%),
    rgba(2, 11, 10, 0.34);
}

.action-icon svg {
  width: 26px;
  height: 26px;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.action-label {
  min-width: 0;
  color: var(--text);
  font-family: "Forum", Georgia, serif;
  font-size: clamp(1.22rem, 5.35vw, 1.62rem);
  line-height: 1.08;
  letter-spacing: 0;
  text-wrap: balance;
}

.action-arrow {
  width: 12px;
  height: 12px;
  border-top: 2px solid var(--gold);
  border-right: 2px solid var(--gold);
  transform: rotate(45deg);
  opacity: 0.9;
}

.footer {
  margin: clamp(12px, 2dvh, 22px) 0 0;
  color: rgba(255, 248, 232, 0.72);
  font-size: clamp(0.68rem, 2.6vw, 0.78rem);
  font-weight: 700;
  letter-spacing: 0.3em;
  line-height: 1.5;
  text-align: center;
  text-transform: uppercase;
  animation: rise 860ms cubic-bezier(0.16, 1, 0.3, 1) 240ms both;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-height: 700px) {
  .screen {
    padding-top: calc(env(safe-area-inset-top) + 16px);
    padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
  }

  .brand-rule {
    margin-bottom: 8px;
  }

  .brand-name {
    font-size: clamp(3.35rem, 16vw, 4.2rem);
  }

  .brand-subtitle {
    margin-top: 8px;
    font-size: 0.68rem;
    letter-spacing: 0.34em;
  }

  .mark-stage {
    min-height: 110px;
    margin-top: 6px;
    margin-bottom: 6px;
  }

  .brand-mark {
    width: clamp(118px, 38vw, 160px);
  }

  .actions {
    gap: 8px;
  }

  .action {
    min-height: 54px;
    grid-template-columns: 40px 1fr 16px;
    padding: 8px 12px;
    border-radius: 20px;
  }

  .action-icon {
    width: 40px;
    height: 40px;
    border-radius: 14px;
  }

  .action-icon svg {
    width: 22px;
    height: 22px;
  }

  .action-label {
    font-size: clamp(1.05rem, 4.9vw, 1.3rem);
  }

  .footer {
    margin-top: 10px;
    font-size: 0.62rem;
    letter-spacing: 0.24em;
  }
}

@media (min-width: 700px) {
  .screen {
    width: 430px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 1ms !important;
  }
}
</style>
</head>
<body>
<main class="qr-page" aria-labelledby="brand-title">
  <div class="screen">
    <header class="brand">
      <div class="brand-rule" aria-hidden="true"></div>
      <h1 class="brand-name" id="brand-title">Дентіс</h1>
      <p class="brand-subtitle">Стоматологічна клініка</p>
    </header>

    <div class="mark-stage">
      <img class="brand-mark" src="image/dentis-logo.webp" alt="Дентіс лого">
    </div>

    <nav class="actions" aria-label="Швидкі дії">
      <a href="data:text/vcard;charset=utf-8,BEGIN:VCARD%0AVERSION:3.0%0AFN:Верховський Олександр Олександрович%0ATEL;TYPE=CELL:+380991234567%0AEND:VCARD"
         download="contact.vcf" class="action">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 10.5a4 4 0 1 1 8 0"/>
            <path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>
            <path d="M6.5 10.5h11"/>
            <path d="M12 2.5v4"/>
          </svg>
        </span>
        <span class="action-label">Додати в контакти</span>
        <span class="action-arrow" aria-hidden="true"></span>
      </a>

      <a href="https://t.me/dentis_notif_bot?start" class="action">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="13" r="7"/>
            <path d="M12 9v4l3 2"/>
            <path d="M8 3h8"/>
          </svg>
        </span>
        <span class="action-label">Нагадування про візит</span>
        <span class="action-arrow" aria-hidden="true"></span>
      </a>

      <a href="https://dentis.kr.ua" class="action">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M3.5 12h17"/>
            <path d="M12 3.5c2.4 2.55 2.4 14.45 0 17"/>
            <path d="M12 3.5c-2.4 2.55-2.4 14.45 0 17"/>
          </svg>
        </span>
        <span class="action-label">Перейти на сайт</span>
        <span class="action-arrow" aria-hidden="true"></span>
      </a>

      <button class="action" type="button" onclick="addToCalendar()">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="5" width="16" height="16" rx="2"/>
            <path d="M4 9h16"/>
            <path d="M8 3v4"/>
            <path d="M16 3v4"/>
            <path d="M8 13h2"/>
            <path d="M12 13h2"/>
            <path d="M16 13h1"/>
            <path d="M8 17h2"/>
            <path d="M12 17h2"/>
          </svg>
        </span>
        <span class="action-label">Додати в календар</span>
        <span class="action-arrow" aria-hidden="true"></span>
      </button>
    </nav>

    <footer class="footer">Сучасна стоматологія · Кропивницький</footer>
  </div>
</main>

<script>
function addToCalendar() {
  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Dentis//UA//EN",
    "BEGIN:VEVENT",
    "SUMMARY:Візит до Верховського О.О.",
    "DTSTART:20260201T120000",
    "DTEND:20260201T130000",
    "DESCRIPTION:Стоматологічна клініка Дентіс",
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");

  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "dentis-visit.ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1200);
}
</script>
</body>
</html>
