<style>
/* === ТВОЇ ЗМІННІ НЕ ЧІПАВ === */
:root {
  --primary: 180 50% 15%;
  --primary-foreground: 40 30% 97%;
  --accent: #2dd4bf;
  --accent-foreground: 0 0% 100%;
  --gold: 38 62% 52%;
  --gold-light: 38 70% 68%;
  --gold-dark: 38 55% 38%;
  --navy: 180 60% 25%;
  --bg: #020617;
  --card: #0f172a;
  --text: #e5e7eb;
  --muted: 40 20% 93%;
  --btn: #1e293b;
  --btn-hover: #334155;
}

/* === BODY (ЗМІНЕНО) === */
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000; /* було з картинкою — прибрав */
}

/* === SPLINE ФОН === */
spline-viewer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
  pointer-events: none;
}

/* overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
}

/* === CARD (ТІЛЬКИ ДОДАНО BLUR) === */
.card {
  width: 360px;
  border-radius: 16px;
  padding: 32px 26px;
  text-align: center;
  position: relative;

  /* blur */


  /* змінив фон на прозорий */
  background:
   linear-gradient(rgba(0, 0, 0, 0.156), rgba(0, 0, 0, 0.236));

  box-shadow:
  0 0 0 1px rgba(255,215,0,0.08) inset,
  0 40px 80px rgba(0,0,0,0.9);

  border: 1px solid rgba(255, 215, 0, 0.2);
}

/* === ВСЕ НИЖЧЕ — ТВОЄ БЕЗ ЗМІН === */

.card::after {
  content: "";
  position: absolute;
  inset: 16px;
  border: 1px solid rgba(255,215,0,0.15);
  border-radius: 18px;
  pointer-events: none;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(0, 0, 0, 0.081), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255, 217, 0, 0.045), transparent 50%);
  mix-blend-mode: screen;
  pointer-events: none;
}

.logo {  
  width: 220px;
  opacity: 0.7;
  
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: 44px;
  color: #e7c46f;
}

.subtitle {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: rgba(255,255,255,0.65);
  margin-bottom: 20px;
}

.btn-row {
  width: 100%;
  max-width: 320px;
  margin: 12px auto;
}

.btn-base {
  display: flex;
  align-items: center;
  position: relative;
  padding: 6px;
  border-radius: 50px;
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 600;
  text-decoration: none;
  background: linear-gradient(180deg,#0a0a0acd,#000000db);
}

.icon-box {
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-gold {
  flex: 1;
  height: 50px;
  border-radius: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg,#e2bc63,#c9983c,#a87421);
  color: #1b1b1b;
  position: relative;
  overflow: hidden;
}

.shine {
  position: absolute;
  left: -80%;
  width: 60%;
  height: 100%;
  background: linear-gradient(120deg,transparent,rgba(255,255,255,0.9),transparent);
  transform: skewX(-20deg);
}

.btn-base:hover .shine {
  animation: shineMove 0.7s ease;
}

@keyframes shineMove {
  100% { left: 140%; }
}

.icon {
  width: 22px;
  height: 22px;
  stroke: #e7c46f;
  stroke-width: 2.2;
  fill: none;
}

.footer {
  margin-top: 24px;
  font-size: 12px;
  color: rgba(255,255,255,0.7);
}
</style>
</head>

<script>
function addToCalendar() {
  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Reminder//UA//EN",
    "BEGIN:VEVENT",
    "SUMMARY:Візит до Верховського О.О.",
    "DTSTART:20260201T120000",
    "DTEND:20260201T130000",
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");

  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "event.ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>
