<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ─── VARIABLES ─── */
:root {
  --gold-1: #f0d080;
  --gold-2: #d4a035;
  --gold-3: #a87421;
  --gold-4: #7a5010;
  --bg-card: rgba(6, 12, 26, 0.72);
  --text: #ede8dc;
  --muted: rgba(237, 232, 220, 0.55);
  --border: rgba(212, 160, 53, 0.22);
  --border-inner: rgba(212, 160, 53, 0.10);
}

/* ─── RESET ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── LOCK SCROLL ─── */
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  -webkit-overflow-scrolling: none;
  overscroll-behavior: none;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  font-family: 'Montserrat', sans-serif;
}

/* ─── SPLINE ─── */
spline-viewer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ─── NOISE OVERLAY ─── */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 128px 128px;
  opacity: 0.35;
}

/* ─── VIGNETTE ─── */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
}

/* ─── CARD WRAPPER ─── */
.card-wrap {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  pointer-events: none;
}

/* ─── CARD ─── */
.card {
  pointer-events: all;
  width: 100%;
  max-width: 380px;
  border-radius: 20px;
  padding: 28px 22px 22px;
  text-align: center;
  position: relative;

  background:
    linear-gradient(160deg, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0.01) 100%),
    var(--bg-card);

  border: 1px solid var(--border);
  box-shadow:
    0 0 0 1px var(--border-inner) inset,
    0 0 60px rgba(0,0,0,0.8),
    0 0 0 0.5px rgba(255,215,0,0.08) inset;

  backdrop-filter: blur(28px) saturate(1.4);
  -webkit-backdrop-filter: blur(28px) saturate(1.4);

  /* entrance animation */
  opacity: 0;
  transform: translateY(18px) scale(0.98);
  animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
}

/* ─── INNER BORDER ─── */
.card::after {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(240, 208, 128, 0.07);
  border-radius: 12px;
  pointer-events: none;
}

/* ─── GOLD CORNER ACCENTS ─── */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 20px;
  background:
    radial-gradient(circle at 18% 22%, rgba(212,160,53,0.07) 0%, transparent 38%),
    radial-gradient(circle at 82% 78%, rgba(212,160,53,0.05) 0%, transparent 38%);
  pointer-events: none;
}

/* corner lines */
.corner { position: absolute; width: 18px; height: 18px; }
.corner svg { width: 100%; height: 100%; }
.corner--tl { top: 10px; left: 10px; }
.corner--tr { top: 10px; right: 10px; transform: rotate(90deg); }
.corner--bl { bottom: 10px; left: 10px; transform: rotate(-90deg); }
.corner--br { bottom: 10px; right: 10px; transform: rotate(180deg); }

/* ─── HEADER ─── */
.header {
  margin-bottom: 6px;
  opacity: 0;
  animation: fadeUp 0.7s ease 0.5s forwards;
}

.brand-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 2px;
}

.brand-line .divider {
  height: 1px;
  width: 28px;
  background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
  opacity: 0.5;
}

.title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 42px;
  font-weight: 300;
  letter-spacing: 0.12em;
  color: var(--gold-1);
  line-height: 1;
  text-shadow: 0 0 40px rgba(212,160,53,0.25);
}

.subtitle {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}

/* ─── LOGO ─── */
.logo-wrap {
  margin: 10px auto 14px;
  opacity: 0;
  animation: fadeUp 0.7s ease 0.65s forwards;
}

.logo {
  width: 180px;
  opacity: 0.55;
  filter: drop-shadow(0 0 12px rgba(212,160,53,0.18));
  transition: opacity 0.4s, filter 0.4s;
}
.logo:hover { opacity: 0.75; filter: drop-shadow(0 0 20px rgba(212,160,53,0.35)); }

/* ─── SEPARATOR ─── */
.sep {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0 10px;
  opacity: 0;
  animation: fadeUp 0.7s ease 0.7s forwards;
}
.sep::before, .sep::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,160,53,0.3), transparent);
}
.sep-diamond {
  width: 5px; height: 5px;
  background: var(--gold-2);
  transform: rotate(45deg);
  opacity: 0.6;
}

/* ─── BUTTONS ─── */
.buttons {
  display: flex;
  flex-direction: column;
  gap: 9px;
  opacity: 0;
  animation: fadeUp 0.7s ease 0.82s forwards;
}

.btn-base {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 5px;
  border-radius: 50px;
  text-decoration: none;
  background: linear-gradient(180deg, rgba(14,14,14,0.9), rgba(0,0,0,0.95));
  border: 1px solid rgba(212,160,53,0.15);
  cursor: pointer;
  font-family: inherit;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s, transform 0.18s;
}

/* button shimmer on hover */
.btn-base::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,215,0,0.04) 50%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
}
.btn-base:hover::before { opacity: 1; }
.btn-base:hover { border-color: rgba(212,160,53,0.35); transform: translateY(-1px); }
.btn-base:active { transform: scale(0.985); }

.icon-box {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.icon {
  width: 20px;
  height: 20px;
  stroke: var(--gold-1);
  stroke-width: 1.8;
  fill: none;
  transition: stroke 0.3s;
}
.btn-base:hover .icon { stroke: #fff; }

.btn-gold {
  flex: 1;
  height: 44px;
  border-radius: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #e8c460 0%, #c9983c 48%, #a87421 100%);
  color: #1a1000;
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.04em;
  position: relative;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(168,116,33,0.3), inset 0 1px 0 rgba(255,255,255,0.25);
}

/* shine */
.shine {
  position: absolute;
  left: -90%;
  top: 0;
  width: 55%;
  height: 100%;
  background: linear-gradient(115deg, transparent, rgba(255,255,255,0.55), transparent);
  transform: skewX(-22deg);
  pointer-events: none;
}
.btn-base:hover .shine {
  animation: shineRun 0.55s ease forwards;
}

/* ─── FOOTER ─── */
.footer {
  margin-top: 14px;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(212,160,53,0.35);
  opacity: 0;
  animation: fadeUp 0.7s ease 1s forwards;
}

/* ─── PARTICLES ─── */
.particles {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: rgba(212,160,53,0.5);
  animation: floatParticle linear infinite;
}

/* ─── KEYFRAMES ─── */
@keyframes cardIn {
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes shineRun {
  100% { left: 140%; }
}
@keyframes floatParticle {
  0%   { transform: translateY(100vh) scale(0); opacity: 0; }
  10%  { opacity: 0.8; }
  90%  { opacity: 0.4; }
  100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
}
@keyframes pulse-ring {
  0%   { transform: scale(0.92); opacity: 0.6; }
  100% { transform: scale(1.08); opacity: 0; }
}

/* ─── MOBILE FINE-TUNE ─── */
@media (max-height: 680px) {
  .card { padding: 20px 18px 18px; }
  .title { font-size: 36px; }
  .logo { width: 150px; }
  .logo-wrap { margin: 6px auto 10px; }
  .buttons { gap: 7px; }
  .btn-gold { height: 40px; font-size: 15px; }
  .icon-box { width: 40px; height: 40px; }
  .sep { margin: 2px 0 8px; }
  .footer { margin-top: 10px; }
}

@media (max-height: 560px) {
  .card { padding: 14px 14px 14px; }
  .title { font-size: 30px; }
  .logo { width: 120px; }
  .logo-wrap { margin: 4px auto 8px; }
  .buttons { gap: 5px; }
  .btn-gold { height: 36px; font-size: 14px; }
  .icon-box { width: 36px; height: 36px; }
  .icon { width: 17px; height: 17px; }
}

@media (min-width: 420px) {
  .card { padding: 34px 28px 26px; }
  .title { font-size: 48px; }
}
</style>

</head>

<script>
/* ── Calendar ── */
function addToCalendar() {
  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Dentis//UA//EN",
    "BEGIN:VEVENT",
    "SUMMARY:Візит до Верховського О.О.",
    "DTSTART:20260201T120000",
    "DTEND:20260201T130000",
    "DESCRIPTION:Стоматологічна клініка Дентіс",
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");

  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = "dentis-visit.ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1200);
}

/* ── Particles ── */
(function spawnParticles() {
  const container = document.getElementById("particles");
  const count = 18;
  for (let i = 0; i < count; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    const size = Math.random() * 2.5 + 1;
    const left = Math.random() * 100;
    const duration = Math.random() * 18 + 12;
    const delay = Math.random() * 14;
    const opacity = Math.random() * 0.4 + 0.15;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${left}%;
      animation-duration:${duration}s;
      animation-delay:-${delay}s;
      opacity:${opacity};
      background:rgba(${Math.random() > 0.5 ? '212,160,53' : '240,208,128'},${opacity});
    `;
    container.appendChild(p);
  }
})();

/* ── Prevent all scroll/swipe ── */
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("wheel",     e => e.preventDefault(), { passive: false });
</script>
