<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Dentis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #020617;
  --card: #0f172a;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --accent: #2dd4bf;
  --btn: #1e293b;
  --btn-hover: #334155;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  width: 360px;
  background: linear-gradient(180deg, #0f172a, #020617);
  border-radius: 26px;
  padding: 28px;
  text-align: center;
  box-shadow: 0 40px 80px rgba(0,0,0,.7);
  position: relative;
  overflow: hidden;
}


.logo {
  width: 280px;
  margin-bottom: 3px;
}



h1 {
  font-size: 20px;
  line-height: 1.25;
  margin: 8px 0 4px;
}

.subtitle {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 22px;
}

.btn {
  display: block;
  padding: 15px;
  margin: 12px 0;
  border-radius: 16px;
  background: var(--btn);
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  transition: .25s ease;
}

.btn:hover {
  background: var(--btn-hover);
  transform: translateY(-1px);
}

.primary {
  background: linear-gradient(135deg, #2dd4bf, #22c55e);
  color: #022c22;
}

.footer {
  margin-top: 18px;
  font-size: 12px;
  color: var(--muted);
}

@keyframes pulseLogo {
  0% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.035;
  }
  50% {
    transform: translate(-50%, -50%) scale(1.06);
    opacity: 0.06;
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.035;
  }
}

.bg-logo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 120%;
  max-width: 480px;
  pointer-events: none;
  animation: pulseLogo 2s ease-in-out infinite;
  filter: blur(0.5px);
}


</style>
</head>

<body>

<div class="card">
  <img class="bg-logo"
src="image/Dentis.webp">

  <!-- ЛОГО -->
  <img class="logo" src="image/Dentis_with_Text.png" />

  

  <h1>ВЕРХОВСЬКИЙ<br>Олександр Олександрович</h1>
  <div class="subtitle">лікар стоматолог</div>

  <!-- ДОДАТИ В КОНТАКТИ -->
  <a class="btn primary" href="data:text/vcard;charset=utf-8,BEGIN:VCARD%0AVERSION:3.0%0AFN:Верховський Олександр Олександрович%0ATEL;TYPE=CELL:+380991234567%0AEND:VCARD" 
   download="verhivsky.vcf" 
   class="contact-button">


 Додати в контакти
  </a>

  <!-- ОПЛАТА -->
  <a class="btn" href="https://www.ipay.ua/ua/request/77gfvrz-mohsoy9grs8tiulbx2dqtydr">
💳 Оплатити послуги
  </a>

  <!-- НАГАДУВАННЯ -->
  <a class="btn" href="data:text/calendar;charset=utf-8,BEGIN:VCALENDAR%0D%0AVERSION:2.0%0D%0APRODID:-//Reminder//UA//EN%0D%0ABEGIN:VEVENT%0D%0ASUMMARY:Візит%20до%20Верховського%20О.О.%0D%0ADTSTART:20260201T120000%0D%0ADTEND:20260201T130000%0D%0AEND:VEVENT%0D%0AEND:VCALENDAR">
📅 Додати нагадування
</a>


  <!-- САЙТ -->
  <a class="btn" href="https://dentis.kr.ua">
🌐 Перейти на сайт
  </a>

  <div class="footer">Dentis • сучасна стоматологія</div>

</div>

</body>
</html>
