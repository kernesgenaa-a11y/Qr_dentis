<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Дентіс — швидкі дії для пацієнтів стоматологічної клініки.">
<title>Дентіс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --text-primary: #020617;
  --text-secondary: #334155;
  --glass-bg: rgba(255, 255, 255, 0.5);
  --glass-bg-hover: rgba(255, 255, 255, 0.7);
  --glass-border: rgba(255, 255, 255, 0.9);
  --glass-shadow: 0 10px 40px rgba(0, 50, 100, 0.08);
  --icon-color: #0369a1;
  --focus: #38bdf8;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100dvh;
  color: var(--text-primary);
  font-family: "Manrope", system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
  background-color: #f8fafc;
  background-image: url('image/bg-fluid.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  display: flex;
  justify-content: center;
  align-items: center;
}



.screen {
  width: min(100%, 420px);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  padding-bottom: calc(env(safe-area-inset-bottom) + 30px);
}

/* Header pill like dynamic island */
.header-pill {
  width: 160px;
  margin: 0 auto;
  background: var(--glass-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-top: none;
  border-radius: 0 0 30px 30px;
  box-shadow: var(--glass-shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 20px 24px;
  animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.brand-mark {
  width: 60px;
  height: auto;
  object-fit: contain;
}

.brand-info {
  text-align: center;
  margin-top: clamp(30px, 5dvh, 40px);
  padding: 0 20px;
  animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
}

.brand-name {
  margin: 0;
  color: var(--text-primary);
  font-size: clamp(2rem, 7vw, 2.5rem);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.03em;
}

.brand-subtitle {
  margin: 8px 0 0;
  color: var(--text-secondary);
  font-size: clamp(0.95rem, 4vw, 1.1rem);
  font-weight: 500;
  line-height: 1.4;
}

.actions {
  display: grid;
  gap: 16px;
  margin-top: clamp(40px, 8dvh, 60px);
  padding: 0 24px;
  animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
}

.action {
  width: 100%;
  min-height: 80px;
  display: flex;
  align-items: center;
  padding: 12px 24px 12px 14px;
  background: var(--glass-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1.5px solid var(--glass-border);
  border-radius: 9999px; /* Pill shape */
  color: inherit;
  box-shadow: 
    var(--glass-shadow),
    inset 0 2px 4px rgba(255,255,255,0.7); /* Inner glass reflection */
  font: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  appearance: none;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.action:hover, .action:focus-visible {
  background: var(--glass-bg-hover);
  transform: translateY(-2px);
  box-shadow: 0 16px 40px rgba(0, 50, 100, 0.12), inset 0 2px 4px rgba(255,255,255,0.9);
  outline: none;
}

.action:active {
  transform: scale(0.98);
}

.action:focus-visible {
  border-color: var(--focus);
}

.action-icon {
  flex-shrink: 0;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.7);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.9);
  color: var(--icon-color);
  margin-right: 18px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.03);
  transition: all 0.3s ease;
}

.action:hover .action-icon {
  background: #ffffff;
  transform: scale(1.05);
}

.action-icon svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.action-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.action-label {
  color: var(--text-primary);
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.2;
}

.action-desc {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 500;
}

.footer-socials {
  margin-top: auto;
  display: flex;
  justify-content: center;
  gap: 16px;
  padding-top: clamp(40px, 8dvh, 60px);
  animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
}

.social-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 50%;
  color: var(--text-secondary);
  text-decoration: none;
  box-shadow: var(--glass-shadow);
  transition: all 0.2s ease;
}

.social-icon:hover {
  background: var(--glass-bg-hover);
  color: var(--icon-color);
  transform: translateY(-2px);
}

.social-icon svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.footer {
  padding: 20px;
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-weight: 600;
  text-align: center;
  animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-100%); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
  }
}
</style>
</head>
<body>


<main class="qr-page" aria-labelledby="brand-title">
  <div class="screen">
    <div class="header-pill">
      <img class="brand-mark" src="image/dentis-logo.webp" alt="Дентіс лого">
    </div>

    <header class="brand-info">
      <h1 class="brand-name" id="brand-title">Дентіс</h1>
      <p class="brand-subtitle">Стоматологічна клініка</p>
    </header>

    <nav class="actions" aria-label="Швидкі дії">
      <a href="data:text/vcard;charset=utf-8,BEGIN:VCARD%0AVERSION:3.0%0AFN:Верховський Олександр Олександрович%0ATEL;TYPE=CELL:+380991234567%0AEND:VCARD"
         download="contact.vcf" class="action">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M18 20a6 6 0 00-12 0" />
            <circle cx="12" cy="10" r="4" />
            <path d="M18 10h3" />
            <path d="M21 10v3" />
          </svg>
        </span>
        <div class="action-text">
          <span class="action-label">Додати в контакти</span>
          <span class="action-desc">Зберегти деталі</span>
        </div>
      </a>

      <a href="https://t.me/dentis_notif_bot?start" class="action">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M22 2L11 13" />
            <path d="M22 2l-7 20-4-9-9-4 20-7z" />
          </svg>
        </span>
        <div class="action-text">
          <span class="action-label">Telegram Бот</span>
          <span class="action-desc">Нагадування про візит</span>
        </div>
      </a>

      <a href="https://dentis.kr.ua" class="action">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z" />
            <path d="M2 12h20" />
          </svg>
        </span>
        <div class="action-text">
          <span class="action-label">Вебсайт</span>
          <span class="action-desc">Ознайомитись з послугами</span>
        </div>
      </a>

      <button class="action" type="button" onclick="addToCalendar()">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
            <circle cx="12" cy="15" r="1" />
          </svg>
        </span>
        <div class="action-text">
          <span class="action-label">Додати в календар</span>
          <span class="action-desc">Запланувати візит</span>
        </div>
      </button>
    </nav>

    <!-- Adding social icons at the bottom as per standard link-tree modern designs -->
    <div class="footer-socials" aria-label="Соціальні мережі">
      <a href="https://dentis.kr.ua" class="social-icon" aria-label="Website">
         <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </a>
      <a href="https://t.me/dentis_notif_bot" class="social-icon" aria-label="Telegram">
        <svg viewBox="0 0 24 24"><path d="M22 2L11 13" /><path d="M22 2l-7 20-4-9-9-4 20-7z" /></svg>
      </a>
      <a href="https://maps.app.goo.gl/tHhyqEih1GzboTsd7" class="social-icon" aria-label="Location">
        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </a>
    </div>

    <footer class="footer">Сучасна стоматологія · Кропивницький</footer>
  </div>
</main>

<script>
function addToCalendar() {
  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Dentis//UA//EN",
    "BEGIN:VEVENT",
    "SUMMARY:Візит до Верховського О.О.",
    "DTSTART:20260201T120000",
    "DTEND:20260201T130000",
    "DESCRIPTION:Стоматологічна клініка Дентіс",
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");

  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "dentis-visit.ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1200);
}
</script>
</body>
</html>
